apiVersion: tekton.dev/v1
kind: Task

metadata:
  name: kaniko-build-task

spec:
  params:
    - name: IMAGE
      type: string

  workspaces:
    - name: source

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:latest

      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker

      command:
        - /kaniko/executor

      args:
        - --dockerfile=$(workspaces.source.path)/app/Dockerfile
        - --context=$(workspaces.source.path)/app
        - --destination=$(params.IMAGE)

      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker

  volumes:
    - name: docker-config
      secret:
        secretName: dockerhub-secret
        items:
          - key: .dockerconfigjson
            path: config.json